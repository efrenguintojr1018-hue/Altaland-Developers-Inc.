<script>
var loggedInUser = null;

function login() {
    var email = document.getElementById('email').value;
    var password = document.getElementById('password').value;

    google.script.run.withSuccessHandler(function(response) {
        response = JSON.parse(response);
        if (response.success) {
            loggedInUser = response.user;
            document.getElementById('login-page').style.display = 'none';
            document.getElementById('dashboard-page').style.display = 'block';
            document.getElementById('welcome-message').innerText = 'Welcome, ' + loggedInUser.email;
            if (loggedInUser.role === 'HR') {
                document.getElementById('admin-panel').style.display = 'block';
                getAllLeaveRequests();
            }
            getLeaveData();
        } else {
            document.getElementById('login-message').innerText = response.message;
        }
    }).withFailureHandler(function(error) {
        document.getElementById('login-message').innerText = "An error occurred: " + error.message;
    }).userLogin(email, password);
}

function logout() {
    loggedInUser = null;
    document.getElementById('login-page').style.display = 'block';
    document.getElementById('dashboard-page').style.display = 'none';
}

function getLeaveData() {
    getLeaveCredits();
    getLeaveRequests();
}

function getLeaveCredits() {
    google.script.run.withSuccessHandler(function(response) {
        var credits = JSON.parse(response);
        var html = '<ul>';
        for (var type in credits) {
            html += '<li>' + type + ': ' + credits[type] + '</li>';
        }
        html += '</ul>';
        document.getElementById('leave-credits').innerHTML = html;
    }).withFailureHandler(function(error) {
        document.getElementById('leave-credits').innerHTML = "An error occurred: " + error.message;
    }).getLeaveCredits(loggedInUser.email);
}

function getLeaveRequests() {
    google.script.run.withSuccessHandler(function(response) {
        var requests = JSON.parse(response);
        displayLeaveRequests('leave-requests-table', requests, false);
    }).withFailureHandler(function(error) {
        var tableBody = document.getElementById('leave-requests-table').getElementsByTagName('tbody')[0];
        tableBody.innerHTML = '<tr><td colspan="4">An error occurred: ' + error.message + '</td></tr>';
    }).getLeaveRequests();
}

function getAllLeaveRequests() {
    google.script.run.withSuccessHandler(function(response) {
        var requests = JSON.parse(response);
        displayLeaveRequests('all-leave-requests-table', requests, true);
    }).withFailureHandler(function(error) {
        var tableBody = document.getElementById('all-leave-requests-table').getElementsByTagName('tbody')[0];
        tableBody.innerHTML = '<tr><td colspan="6">An error occurred: ' + error.message + '</td></tr>';
    }).getLeaveRequests();
}

function displayLeaveRequests(tableId, requests, isAdmin) {
    var tableBody = document.getElementById(tableId).getElementsByTagName('tbody')[0];
    tableBody.innerHTML = '';
    for (var i = 1; i < requests.length; i++) {
        var request = requests[i];
        if (!isAdmin && request[0] !== loggedInUser.email) {
            continue;
        }
        var row = tableBody.insertRow();
        var cell1 = row.insertCell(0);
        var cell2 = row.insertCell(1);
        var cell3 = row.insertCell(2);
        var cell4 = row.insertCell(3);

        if (isAdmin) {
            var cell5 = row.insertCell(4);
            var cell6 = row.insertCell(5);
            cell1.innerHTML = request[0];
            cell2.innerHTML = formatDate(request[1]);
            cell3.innerHTML = formatDate(request[2]);
            cell4.innerHTML = request[3];
            cell5.innerHTML = request[4];
            if (request[4] === 'Pending') {
                cell6.innerHTML = '<button onclick="approveRequest(' + (i + 1) + ')">Approve</button>' +
                                  '<button onclick="rejectRequest(' + (i + 1) + ')">Reject</button>';
            }
        } else {
            cell1.innerHTML = formatDate(request[1]);
            cell2.innerHTML = formatDate(request[2]);
            cell3.innerHTML = request[3];
            cell4.innerHTML = request[4];
        }
    }
}

function formatDate(dateString) {
    var date = new Date(dateString);
    var month = date.getMonth() + 1;
    var day = date.getDate();
    var year = date.getFullYear();
    return month + '/' + day + '/' + year;
}

function approveRequest(row) {
    google.script.run.withSuccessHandler(function(response) {
        response = JSON.parse(response);
        if (response.success) {
            alert(response.message);
            getAllLeaveRequests();
        }
    }).withFailureHandler(function(error) {
        alert("An error occurred: " + error.message);
    }).updateLeaveRequestStatus(row, "Approved");
}

function rejectRequest(row) {
    google.script.run.withSuccessHandler(function(response) {
        response = JSON.parse(response);
        if (response.success) {
            alert(response.message);
            getAllLeaveRequests();
        }
    }).withFailureHandler(function(error) {
        alert("An error occurred: " + error.message);
    }).updateLeaveRequestStatus(row, "Rejected");
}

document.getElementById('leave-request-form').addEventListener('submit', function(e) {
    e.preventDefault();
    var request = {
        employeeEmail: loggedInUser.email,
        startDate: document.getElementById('start-date').value,
        endDate: document.getElementById('end-date').value,
        leaveType: document.getElementById('leave-type').value
    };
    google.script.run.withSuccessHandler(function(response) {
        response = JSON.parse(response);
        if (response.success) {
            alert(response.message);
            getLeaveData();
        }
    }).withFailureHandler(function(error) {
        alert("An error occurred: " + error.message);
    }).submitLeaveRequest(request);
});
</script>
