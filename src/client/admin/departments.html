<div>
  <h3>Departments</h3>

  <!-- Add/Edit Form -->
  <form id="department-form">
    <input type="hidden" id="departmentId">
    <input type="text" id="departmentName" placeholder="Department Name" required>
    <button type="submit">Save Department</button>
  </form>

  <!-- Departments Table -->
  <table id="departments-table">
    <thead>
      <tr>
        <th>Department Name</th>
        <th>Actions</th>
      </tr>
    </thead>
    <tbody>
      <!-- Department data will be loaded here -->
    </tbody>
  </table>
</div>
<script>
  document.addEventListener('DOMContentLoaded', function() {
    loadDepartments();

    const form = document.getElementById('department-form');
    form.addEventListener('submit', function(e) {
      e.preventDefault();
      const departmentId = document.getElementById('departmentId').value;
      const departmentName = document.getElementById('departmentName').value;

      if (departmentId) {
        // Update
        google.script.run.withSuccessHandler(loadDepartments).updateDepartment(departmentId, departmentName);
      } else {
        // Add
        google.script.run.withSuccessHandler(loadDepartments).addDepartment(departmentName);
      }
      form.reset();
    });
  });

  function loadDepartments() {
    google.script.run.withSuccessHandler(function(departments) {
      const tbody = document.getElementById('departments-table').getElementsByTagName('tbody')[0];
      tbody.innerHTML = '';
      departments.forEach(function(dept) {
        const row = tbody.insertRow();
        row.insertCell(0).innerText = dept.DepartmentName;
        const actionsCell = row.insertCell(1);

        const editButton = document.createElement('button');
        editButton.innerText = 'Edit';
        editButton.onclick = function() {
          document.getElementById('departmentId').value = dept.DepartmentID;
          document.getElementById('departmentName').value = dept.DepartmentName;
        };
        actionsCell.appendChild(editButton);

        const deleteButton = document.createElement('button');
        deleteButton.innerText = 'Delete';
        deleteButton.onclick = function() {
          if (confirm('Are you sure you want to delete this department?')) {
            google.script.run.withSuccessHandler(loadDepartments).deleteDepartment(dept.DepartmentID);
          }
        };
        actionsCell.appendChild(deleteButton);
      });
    }).getDepartments();
  }
</script>
