<div>
  <h3>Employees</h3>

  <form id="employee-form">
    <input type="hidden" id="employeeId">
    <input type="text" id="firstName" placeholder="First Name" required>
    <input type="text" id="lastName" placeholder="Last Name" required>
    <input type="email" id="email" placeholder="Email" required>
    <input type="password" id="password" placeholder="New Password (leave blank to keep current)">
    <select id="department" required></select>
    <select id="role" required>
      <option value="Admin">Admin</option>
      <option value="Employee">Employee</option>
    </select>
    <select id="status" required>
      <option value="Active">Active</option>
      <option value="Inactive">Inactive</option>
    </select>
    <button type="submit">Save Employee</button>
  </form>

  <!-- Employees Table -->
  <table id="employees-table">
    <thead>
      <tr>
        <th>Name</th>
        <th>Email</th>
        <th>Department</th>
        <th>Role</th>
        <th>Status</th>
        <th>Actions</th>
      </tr>
    </thead>
    <tbody>
      <!-- Employee data will be loaded here -->
    </tbody>
  </table>
</div>
<script>
  document.addEventListener('DOMContentLoaded', function() {
    loadEmployees();
    loadDepartmentsIntoSelect();

    const form = document.getElementById('employee-form');
    form.addEventListener('submit', function(e) {
      e.preventDefault();
      const employee = {
        employeeId: document.getElementById('employeeId').value,
        firstName: document.getElementById('firstName').value,
        lastName: document.getElementById('lastName').value,
        email: document.getElementById('email').value,
        password: document.getElementById('password').value, // Will be empty if not changed
        departmentId: document.getElementById('department').value,
        role: document.getElementById('role').value,
        status: document.getElementById('status').value,
      };

      if (employee.employeeId) {
        // Update
        google.script.run.withSuccessHandler(loadEmployees).updateEmployee(employee);
      } else {
        // Add
        google.script.run.withSuccessHandler(loadEmployees).addEmployee(employee);
      }
      form.reset();
    });
  });

  function loadDepartmentsIntoSelect() {
    google.script.run.withSuccessHandler(function(departments) {
      const select = document.getElementById('department');
      select.innerHTML = '';
      departments.forEach(function(dept) {
        const option = document.createElement('option');
        option.value = dept.DepartmentID;
        option.innerText = dept.DepartmentName;
        select.appendChild(option);
      });
    }).getDepartments();
  }

  function loadEmployees() {
    google.script.run.withSuccessHandler(function(employees) {
      const tbody = document.getElementById('employees-table').getElementsByTagName('tbody')[0];
      tbody.innerHTML = '';
      employees.forEach(function(emp) {
        const row = tbody.insertRow();
        row.insertCell(0).innerText = emp.FirstName + ' ' + emp.LastName;
        row.insertCell(1).innerText = emp.Email;
        row.insertCell(2).innerText = emp.DepartmentName;
        row.insertCell(3).innerText = emp.Role;
        row.insertCell(4).innerText = emp.Status;
        const actionsCell = row.insertCell(5);

        const editButton = document.createElement('button');
        editButton.innerText = 'Edit';
        editButton.onclick = function() {
          document.getElementById('employeeId').value = emp.EmployeeID;
          document.getElementById('firstName').value = emp.FirstName;
          document.getElementById('lastName').value = emp.LastName;
          document.getElementById('email').value = emp.Email;
          document.getElementById('password').value = ''; // Clear the password field
          document.getElementById('department').value = emp.DepartmentID;
          document.getElementById('role').value = emp.Role;
          document.getElementById('status').value = emp.Status;
        };
        actionsCell.appendChild(editButton);

        const deleteButton = document.createElement('button');
        deleteButton.innerText = 'Delete';
        deleteButton.onclick = function() {
          if (confirm('Are you sure you want to delete this employee?')) {
            google.script.run.withSuccessHandler(loadEmployees).deleteEmployee(emp.EmployeeID);
          }
        };
        actionsCell.appendChild(deleteButton);
      });
    }).getEmployees();
  }
</script>
